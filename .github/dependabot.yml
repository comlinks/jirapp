version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # サプライチェーン攻撃（公開直後の悪性バージョン）対策に、公開から一定日数
    # 経過したバージョンのみを提案させる。
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      # TypeScript 7.0 はネイティブ (Go) 実装で typescript/lib/tsc を公開しないため、
      # それを require する vue-tsc (Volar) が起動できない。
      # Volar が使えるプログラマティック API は TS 7.1 で安定予定なので、
      # 7.0.x だけを無視して 7.1 の PR は受け取る（CI が可否を判定する）。
      # 7.1 でもまだ動かなければ 7.1.x をこの一覧に追加する
      - dependency-name: "typescript"
        versions: ["7.0.x"]
    groups:
      tauri:
        patterns:
          - "@tauri-apps/*"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      tauri:
        patterns:
          - "tauri"
          - "tauri-*"
    ignore:
      # windows クレートは tauri/tao/wry が使うバージョン(現状 0.61)に揃える必要がある。
      # 先行して上げると sysmenu.rs の HWND 等の型が二重定義になりビルドが壊れるため、
      # 自動更新対象から外し、tauri 更新に合わせて手動で追従する。
      - dependency-name: "windows"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
