name: Security Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # Monday 9:00 UTC

permissions:
  contents: read

# 監査コマンドの中身は justfile のレシピ（audit-cargo / audit-npm）に寄せてある。
jobs:
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run cargo audit
        run: just audit-cargo

  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: extractions/setup-just@v4
      - run: npm ci
      # 出荷物（dist）に影響する本番依存のみを対象に、critical のみで失敗させる。
      - name: Run npm audit
        run: just audit-npm
