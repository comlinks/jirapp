name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# 各ステップの中身は justfile のレシピに寄せてある（ローカルの `just check` と同じ内容・
# 同じ順）。コマンドを変えるときは justfile 側だけを直せば両方に効く。
jobs:
  check:
    name: Check & Test
    runs-on: windows-latest
    steps:
      # Windows ランナーでの CRLF 自動変換による diff/format 誤検知を防ぐ。
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: extractions/setup-just@v4

      - name: Install frontend dependencies
        run: npm ci

      # フロント: TypeScript 型チェック + Vite ビルド。
      # tauri-build が frontendDist (../dist) の存在を要求するため Rust より先に実行する。
      - name: Vue/TypeScript check & build
        run: just build

      - name: cargo fmt --check
        run: just fmt-check

      - name: cargo clippy
        run: just clippy

      # Rust: ユニットテスト。
      - name: cargo test
        run: just test

  # Jira へ注入する静的 JS（src-tauri/src/inject/*.js）の Biome lint。
  # フロント（Vue/TS）は npm run build の型チェック側で担保するため対象外。
  # 設定は biome.json（includes を inject/*.js に限定・formatter off・lint のみ）。
  # Biome の版は justfile の biome_version に一本化している。
  lint-inject:
    name: Lint injected JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: extractions/setup-just@v4
      - name: Biome lint
        run: just lint-inject
